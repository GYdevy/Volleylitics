html {

#volleylitics-pipeline {
  --vp-accent: var(--primary, #7c6cff);
  --vp-line: var(--border, #30343b);
  --vp-bg: var(--background, #111318);
  --vp-text: var(--foreground, #eceef2);
  --vp-muted: var(--muted-foreground, #969ba6);
  --vp-hover: var(--accent, #20232b);

  width: 100%;
  margin: 32px 0;
  color: var(--vp-text);
  font-family: inherit;
}

#volleylitics-pipeline *,
#volleylitics-pipeline *::before,
#volleylitics-pipeline *::after {
  box-sizing: border-box;
}

#volleylitics-pipeline .vp-viewport {
  width: 100%;
  padding: 6px 0 12px;
  overflow-x: auto;
  scrollbar-width: thin;
}

#volleylitics-pipeline .vp-network {
  position: relative;
  width: 1160px;
  height: 340px;
}

#volleylitics-pipeline .vp-connectors {
  position: absolute;
  inset: 0;
  width: 1160px;
  height: 340px;
  color: var(--vp-line);
  overflow: visible;
}

#volleylitics-pipeline .vp-connectors path {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.25;
  vector-effect: non-scaling-stroke;
}

#volleylitics-pipeline .vp-connectors marker path {
  fill: currentColor;
  stroke: none;
}

#volleylitics-pipeline .vp-junction {
  fill: var(--vp-accent);
}

#volleylitics-pipeline .vp-step {
  position: absolute;
  z-index: 1;
  display: flex;
  width: 100px;
  min-width: 0;
  padding: 0 3px;
  border: 0;
  background: transparent;
  color: var(--vp-text);
  font: inherit;
  text-align: center;
  cursor: pointer;
  flex-direction: column;
  align-items: center;
}

#volleylitics-pipeline .vp-icon {
  display: grid;
  width: 50px;
  height: 50px;
  border: 1px solid var(--vp-line);
  border-radius: 50%;
  background: var(--vp-bg);
  color: var(--vp-muted);
  place-items: center;
  transition:
    transform 180ms ease,
    border-color 180ms ease,
    color 180ms ease,
    background-color 180ms ease;
}

#volleylitics-pipeline .vp-icon svg {
  width: 21px;
  height: 21px;
  stroke-width: 1.7;
}

#volleylitics-pipeline .vp-step:hover .vp-icon,
#volleylitics-pipeline .vp-step:focus-visible .vp-icon,
#volleylitics-pipeline .vp-step.is-active .vp-icon {
  border-color: var(--vp-accent);
  background: var(--vp-hover);
  color: var(--vp-accent);
  transform: scale(1.13);
}

#volleylitics-pipeline .vp-step:focus-visible {
  outline: none;
}

#volleylitics-pipeline .vp-stage-number {
  margin-top: 8px;
  color: var(--vp-accent);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.06em;
}

#volleylitics-pipeline .vp-label {

#volleylitics-pipeline .vp-label small {

#volleylitics-pipeline .vp-detail {

/* Editorial writeup shell — matches the clean preview style. */
:root {
  --background: #181818;

<body>
  <div class="topbar">
    <a class="back" href="../">← Back to Volleylitics</a>
    <button id="technicalBtn">Technical</button>

  </div>

  <main id="content" class="markdown-body"></main>
  <script src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <script>
    const content = document.getElementById("content");
    const technicalBtn = document.getElementById("technicalBtn");
    

    function slugify(text) {
      return text
        .toLowerCase()
        .trim()
        .replace(/[^\w\s-]/g, "")
        .replace(/\s+/g, "-");
    }

    const renderer = new marked.Renderer();

    renderer.heading = function ({ tokens, depth }) {
      const rawText = tokens.map(t => t.raw || "").join("");
      const htmlText = this.parser.parseInline(tokens);
      const id = slugify(rawText);
      return `<h${depth} id="${id}">${htmlText}</h${depth}>`;
    };
    marked.setOptions({
      renderer,
      gfm: true,
      breaks: false
    });

    async function loadMarkdown() {
        const file = "../data/blog/technical.md";

      const response = await fetch(file);

      if (!response.ok) {
        content.innerHTML = `<p>Could not load ${file}</p>`;
        return;
      }

      const markdown = await response.text();
      const unsafeHtml = marked.parse(markdown);

     content.innerHTML = DOMPurify.sanitize(unsafeHtml, {
  ADD_TAGS: [
    "audio",
    "source",
    "svg",
    "path",
    "circle",
    "defs",
    "marker"
  ],
  ADD_ATTR: [
    "controls",
    "src",
    "type",
    "viewBox",
    "d",
    "cx",
    "cy",
    "r",
    "markerWidth",
    "markerHeight",
    "refX",
    "refY",
    "orient",
    "marker-end",
    "data-title",
    "data-description",
    "data-lucide"
  ]
});

initializeVolleyliticsPipeline();

document.querySelectorAll("pre code").forEach((block) => {
  hljs.highlightElement(block);
}); 
      technicalBtn.classList.add("active");
      

      

      if (window.location.hash) {
        const target = document.querySelector(window.location.hash);
        if (target) target.scrollIntoView();
      }
    }

    technicalBtn.onclick = () => loadMarkdown();

    

function initializeVolleyliticsPipeline() {
  const root = document.getElementById("volleylitics-pipeline");
  if (!root) return;

  window.lucide?.createIcons();

  const steps = [...root.querySelectorAll(".vp-step")];
  const title = root.querySelector(".vp-detail strong");
  const description = root.querySelector(".vp-detail span");

  if (!steps.length || !title || !description) return;

  let selected = root.querySelector(".vp-step.is-active") || steps[0];

  const viewport = root.querySelector(".vp-viewport");
  const network = root.querySelector(".vp-network");
  const naturalWidth = 1160;
  const naturalHeight = 340;

  const fitPipeline = () => {
    if (!viewport || !network) return;

    const scale = Math.min(1, viewport.clientWidth / naturalWidth);
    const renderedWidth = naturalWidth * scale;

    network.style.transform = `scale(${scale})`;
    network.style.marginLeft = `${Math.max(0, (viewport.clientWidth - renderedWidth) / 2)}px`;
    viewport.style.height = `${naturalHeight * scale + 18}px`;
  };

  function showStep(step) {
    title.textContent = step.dataset.title;
    description.textContent = step.dataset.description;
  }

  steps.forEach((step) => {
    step.addEventListener("mouseenter", () => showStep(step));
    step.addEventListener("mouseleave", () => showStep(selected));
    step.addEventListener("focus", () => showStep(step));
    step.addEventListener("blur", () => showStep(selected));

    step.addEventListener("click", () => {
      steps.forEach((item) => item.classList.remove("is-active"));
      step.classList.add("is-active");
      selected = step;
      showStep(step);
    });
  });

  showStep(selected);
  fitPipeline();

  if ("ResizeObserver" in window) {
    const observer = new ResizeObserver(fitPipeline);
    observer.observe(root);
  } else {
    window.addEventListener("resize", fitPipeline);
  }
}

    loadMarkdown();
    document.addEventListener("click", function (e) {
  let el = e.target;

  // 🔥 walk up manually (safe)
  while (el && el.tagName !== "A") {
    el = el.parentElement;
  }

  if (!el) return;

  const href = el.getAttribute("href");
  if (!href || !href.startsWith("#")) return;

  const target = document.querySelector(href);
  if (!target) return;

  e.preventDefault();

  const yOffset = -110;
  const y = target.getBoundingClientRect().top + window.scrollY + yOffset;

  window.scrollTo({ top: y, behavior: "smooth" });

  history.pushState(null, "", href);
});
  </script>
