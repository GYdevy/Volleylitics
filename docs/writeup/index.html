<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volleylitics Writeup</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css/github-markdown-dark.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js/styles/github-dark.min.css">

  <style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface-hover: #1f2937;
    --text: #c9d1d9;
    --muted: #8b949e;
    --border: #30363d;
    --blue: #38bdf8;
    --orange: #f97316;
  }

  body {
    margin: 0;
    background: radial-gradient(circle at top, rgba(56, 189, 248, 0.10), transparent 35%),
                var(--bg);
    color: var(--text);
    font-family: system-ui, sans-serif;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 22px;
    background: rgba(13, 17, 23, 0.96);
    border-bottom: 1px solid var(--border);
  }

  .back {
    color: var(--muted);
    text-decoration: none;
    margin-right: auto;
  }

  .back:hover {
    color: var(--blue);
  }

  button {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    padding: 8px 13px;
    border-radius: 8px;
    cursor: pointer;
  }

  button:hover {
    border-color: var(--blue);
  }

  button.active {
    background: linear-gradient(135deg, var(--blue), var(--orange));
    border-color: transparent;
    color: white;
  }

  .markdown-body {
    max-width: 900px;
    margin: 0 auto;
    padding: 42px 24px 90px;
    box-sizing: border-box;
    background: transparent;
    color: var(--text);
  }

  .markdown-body a {
    color: var(--blue);
  }

  .markdown-body h1,
  .markdown-body h2 {
    color: var(--orange);
    scroll-margin-top: 90px;
  }

  .markdown-body h3,
  .markdown-body h4 {
    color: var(--blue);
    scroll-margin-top: 90px;
  }

  .markdown-body img {
    display: block;
    max-width: 100%;
    margin: 18px auto;
    border-radius: 10px;
    border: 1px solid var(--border);
  }

  .markdown-body audio {
    width: 100%;
    margin: 12px 0 20px;
  }

  .markdown-body pre {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
  }

  .markdown-body code {
    font-size: 0.95em;
  }

  .markdown-body blockquote {
    border-left: 4px solid var(--orange);
    color: var(--muted);
  }

  .markdown-body details {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    background: rgba(22, 27, 34, 0.6);
  }

  .markdown-body summary {
    cursor: pointer;
    color: var(--blue);
    font-weight: 600;
  }
  .markdown-body pre {
  background: #0b1220;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  overflow-x: auto;
}

.markdown-body pre code {
  background: transparent;
  color: inherit;
  padding: 0;
  font-size: 0.92rem;
  line-height: 1.6;
}
.markdown-body h1,
.markdown-body h2,
.markdown-body h3,
.markdown-body h4 {
  scroll-margin-top: 500px;


}
html {
  scroll-behavior: smooth;
}
</style>
</head>

<body>
  <div class="topbar">
    <a class="back" href="../">← Back to Volleylitics</a>
    <button id="technicalBtn">Technical</button>

  </div>

  <main id="content" class="markdown-body"></main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <script>
    const content = document.getElementById("content");
    const technicalBtn = document.getElementById("technicalBtn");
    

    function slugify(text) {
      return text
        .toLowerCase()
        .trim()
        .replace(/[^\w\s-]/g, "")
        .replace(/\s+/g, "-");
    }

    const renderer = new marked.Renderer();

    renderer.heading = function ({ tokens, depth }) {
      const rawText = tokens.map(t => t.raw || "").join("");
      const htmlText = this.parser.parseInline(tokens);
      const id = slugify(rawText);
      return `<h${depth} id="${id}">${htmlText}</h${depth}>`;
    };
	renderer.code = function ({ text, lang }) {
  const language = lang || "plaintext";
  return `<pre><code class="hljs language-${language}">${text}</code></pre>`;
};
    marked.setOptions({
      renderer,
      gfm: true,
      breaks: false
    });

    async function loadMarkdown() {
      const file = mode === "story"
        ? "../data/blog/story.md"
        : "../data/blog/technical.md";

      const response = await fetch(file);

      if (!response.ok) {
        content.innerHTML = `<p>Could not load ${file}</p>`;
        return;
      }

      const markdown = await response.text();
      const unsafeHtml = marked.parse(markdown);

      content.innerHTML = DOMPurify.sanitize(unsafeHtml, {
        ADD_TAGS: ["audio", "source"],
        ADD_ATTR: ["controls", "src", "type"]
      });

      document.querySelectorAll("pre code").forEach((block) => {
        hljs.highlightElement(block);
      });

      technicalBtn.classList.toggle("active", mode === "technical");
      

      

      if (window.location.hash) {
        const target = document.querySelector(window.location.hash);
        if (target) target.scrollIntoView();
      }
    }

    technicalBtn.onclick = () => loadMarkdown("technical");

    

    loadMarkdown();
    document.addEventListener("click", function (e) {
  let el = e.target;

  // 🔥 walk up manually (safe)
  while (el && el.tagName !== "A") {
    el = el.parentElement;
  }

  if (!el) return;

  const href = el.getAttribute("href");
  if (!href || !href.startsWith("#")) return;

  const target = document.querySelector(href);
  if (!target) return;

  e.preventDefault();

  const yOffset = -110;
  const y = target.getBoundingClientRect().top + window.scrollY + yOffset;

  window.scrollTo({ top: y, behavior: "smooth" });

  history.pushState(null, "", href);
});
  </script>
</body>
</html>
