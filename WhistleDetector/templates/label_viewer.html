<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Whistle Labeler</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #202020; color: #eee; }
        img { max-width: 90%; margin: 10px; border-radius: 8px; }
        button { padding: 12px 20px; margin: 6px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; }
        .whistle { background: #2ecc71; }
        .crowd { background: #e67e22; }
        .squeak { background: #9b59b6; }
        .speech { background: #3498db; }
        .other { background: #95a5a6; }
        .skip { background: #7f8c8d; }
        iframe { border: none; border-radius: 10px; margin: 10px; }
    </style>
</head>
<body>
    <h1>🎧 Labeling: {{ match }} @ {{ timestamp }}</h1>

    {% if video_url %}
    <iframe width="640" height="360" src="{{ video_url }}" allowfullscreen></iframe>
    {% endif %}

    <div>
        <img src="{{ png_path }}" alt="Spectrogram">
        <audio controls src="{{ wav_path }}"></audio>
    </div>

    <form action="{{ url_for('label') }}" method="post">
        <input type="hidden" name="match" value="{{ match }}">
        <input type="hidden" name="timestamp" value="{{ timestamp }}">
        {% for opt in label_options %}
        <button name="label" value="{{ opt }}" class="{{ opt }}">{{ opt|capitalize }}</button>
        {% endfor %}
    </form>

    <p>Reloads next sample after labeling ✅</p>
</body>
</html>
