name: Site checks

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/validate_site.py"
      - "scripts/site_smoke_test.py"
      - ".github/workflows/site-checks.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/validate_site.py"
      - "scripts/site_smoke_test.py"
      - ".github/workflows/site-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-smoke:
    name: Validate and serve site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate match catalog
        run: python scripts/validate_site.py

      - name: Smoke-test static site
        run: python scripts/site_smoke_test.py
